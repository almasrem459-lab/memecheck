# memecheck-smart: separate Worker (DO alarm scheduler) for MemeCheck /smart.html (does not change the production Pages project).
name = "memecheck-smart"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[triggers]  # no cron: free plan allows 5 per account and memecheck-warmer uses all 5 -> DO alarm loop instead
crons = []

# State in one SQLite-backed Durable Object (free plan) - no KV writes.
[[durable_objects.bindings]]
name = "SMART"
class_name = "SmartDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SmartDO"]

# Reads cached MemeCheck core scans (core:solana:*); writes ONE key, smart:v1, every ~20 min (~72 writes/day), counted in D1 kv_writes.
[[kv_namespaces]]
binding = "MEMECHECK_CACHE"
id = "b5362a97a846452d9a41db24111b939c"

[observability]
enabled = true

# Exact KV write counter (table kv_writes) shared with Pages; see functions/_lib/shared.js
[[d1_databases]]
binding = "REV"
database_name = "memecheck-revenue"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"  # same D1 as Pages REV
