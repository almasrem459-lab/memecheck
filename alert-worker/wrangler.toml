name = "memecheck-alert"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

[[durable_objects.bindings]]
name = "WATCH"
class_name = "WatchBook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchBook"]

# No Workers cron here: this account is on Free (max 5 cron triggers already used).
# Poll via external cron → POST https://memecheck-alert.memecheck.workers.dev/cron
# (optional header x-alert-cron: <ALERT_CRON_SECRET>) every 5 minutes.
# Or upgrade to Workers Paid and re-enable [triggers] crons = ["*/5 * * * *"].

# Secrets (not in git):
#   wrangler secret put TELEGRAM_BOT_TOKEN
# Optional: MEMECHECK_ORIGIN, ALERT_CRON_SECRET via wrangler secret / vars

[vars]
MEMECHECK_ORIGIN = "https://memecheck.pages.dev"

[observability]
enabled = true
