name = "memecheck-warmer"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

[triggers]
# Free plan = 5 cron triggers per account. One "every minute" trigger replaces the old five staggered */5 triggers (same schedule),
# which frees three triggers for the RugDNA jobs (src/index.js RUGDNA_JOBS): ingest, resolve, recheck.
crons = ["* * * * *", "1-59/5 * * * *", "3-59/5 * * * *", "4-59/10 * * * *"]

[[kv_namespaces]]
binding = "MEMECHECK_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"  # same KV as Pages MEMECHECK_CACHE

# Exact KV write counter (table kv_writes) shared with Pages; see functions/_lib/shared.js
[[d1_databases]]
binding = "REV"
database_name = "memecheck-revenue"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"  # same D1 as Pages REV

# RugDNA (open launcher-wallet identity graph): launches, funders, clusters, flagged-before-rug ledger, daily snapshots
[[d1_databases]]
binding = "RUGDNA"
database_name = "memecheck-rugdna"
database_id = "REPLACE_WITH_YOUR_RUGDNA_D1_ID"  # wrangler d1 create memecheck-rugdna && wrangler d1 execute memecheck-rugdna --remote --file rugdna/schema.sql
