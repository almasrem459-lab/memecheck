name = "memecheck"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "MEMECHECK_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"  # wrangler kv namespace create MEMECHECK_CACHE

[ai]
binding = "AI"  # Workers AI (free daily allowance) for /api/ai

# Community chat (/chat, /api/chat*): ChatRoom Durable Object hosted by the separate `memecheck-chat` Worker (chat-worker/).
# Deploy chat-worker first (cd chat-worker && wrangler deploy && wrangler secret put ADMIN_TOKEN).
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"
script_name = "memecheck-chat"

# Revenue features (accounts / Pro / API keys / project boosts). D1, not KV.
[[d1_databases]]
binding = "REV"
database_name = "memecheck-revenue"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"  # wrangler d1 create memecheck-revenue

